[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DiffGSP"
version = "0.1.0"
description = "A spatial transcriptomics tool for addressing transcript diffusion based on Fick's law graph signal processing."

authors = [
    { name = "Jixin Liu", email = "frankliu210@163.com" },
    { name = "Shuli Sun", email = "shuli.sun@qq.com" }
]

license = { text = "MIT" }

requires-python = ">=3.9"

dependencies = [
    "numpy==2.0.2",
    "pandas==2.3.3",
    "scipy==1.13.1",
    "scikit-learn==1.6.1",
    "tqdm==4.67.1",
    "matplotlib==3.9.4",
    "leidenalg==0.10.0",
    "ipython==8.18.1",
    "kneed==0.8.5",
    "scanpy==1.10.0"
]

[tool.setuptools.packages.find]
where = ["."]